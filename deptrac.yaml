deptrac:
  paths:
    - ./Foundation
    - ./Presentation
    - ./Config
    - ./bootstrap
    - ./bin
  layers:
    - name: Foundation
      collectors:
        - type: directory
          value: Foundation/(Text|Helpers|Enums|Time|Contracts|Exceptions)/.*
    - name: Capability
      collectors:
        - type: directory
          value: Foundation/(Auth|Cache|Container|Database|Filesystem|HTTP|Logging|Middlewares|View|Security|Repository|Entity|DataHandling|DataLayer|DataFoundation)/.*
    - name: Flow
      collectors:
        - type: directory
          value: Foundation/ApplicationWorkflow/.*
    - name: Configuration
      collectors:
        - type: directory
          value: (Foundation/Config|Config|bootstrap)/.*
    - name: Presentation
      collectors:
        - type: directory
          value: Presentation/.*
    - name: EntryPoint
      collectors:
        - type: directory
          value: (bin|public)/.*

  ruleset:
    Presentation:
      - Flow
      - Capability
      - Foundation
    Flow:
      - Capability
      - Foundation
    Capability:
      - Foundation
      - Capability
    Configuration:
      - Flow
      - Capability
      - Foundation
      - Presentation
    Foundation:
      - Foundation
    EntryPoint:
      - Configuration
      - Flow
      - Capability
      - Foundation
